# UI nginx config WITH optional OpenGraph routing for /profile/* link previews.
#
# This is the `improve-dockerfile-image` branch nginx.conf + a User-Agent `map`
# and the OG locations. Drop it in place of that branch's nginx.conf to enable
# crawler unfurls. The `map` is valid here because the file is included within
# nginx's http{} block (conf.d/*.conf).
#
# The OG upstream is resolved lazily (via a variable + resolver), so nginx still
# starts and humans still get the SPA even when brainstorm-og is NOT deployed —
# only crawler requests to /profile/* and /og/* 502 in that case.

map $http_user_agent $is_og_bot {
    default 0;
    "~*(facebookexternalhit|Twitterbot|Slackbot|Discordbot|TelegramBot|WhatsApp|LinkedInBot|Pinterest|redditbot|Applebot|bingbot|Googlebot|vkShare|Embedly|Iframely|Mastodon)" 1;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — lets the OG upstream resolve at request time, not
    # config-load time, so an absent brainstorm-og can't stop nginx from booting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # OG card images — always served by the OG service (humans never request these).
    location /og/ {
        set $og_upstream brainstorm-og:8080;
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
    }

    # Profiles — crawlers get server-rendered OG meta tags; humans get the SPA.
    # (error_page trick avoids the "if + proxy_pass" pitfall inside a try_files location.)
    location /profile/ {
        error_page 418 = @og;
        if ($is_og_bot) { return 418; }
        try_files $uri $uri/ /index.html;
    }
    location @og {
        set $og_upstream brainstorm-og:8080;
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html (deploys must propagate)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
