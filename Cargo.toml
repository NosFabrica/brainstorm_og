[package]
name = "brainstorm-og"
version = "0.1.0"
edition = "2021"
description = "Optional OpenGraph link-preview card service for Brainstorm profiles"

[[bin]]
name = "brainstorm-og"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }

# HTTP client (overview API + avatar fetch); rustls so the image is openssl-free.
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "rustls", "webpki-roots"] }

# Nostr relay query for kind-0 metadata.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# NIP-19 decode (npub / nprofile).
bech32 = "0.12"
hex = "0.4"

# Card rendering: SVG -> PNG, no headless browser.
resvg = "0.47"
image = "0.25"
base64 = "0.22"

# Bounded in-memory cache.
moka = { version = "0.12", features = ["future"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
