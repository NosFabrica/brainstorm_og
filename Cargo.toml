[package]
name = "brainstorm-og"
version = "0.1.0"
edition = "2021"
description = "OpenGraph share-card service for Brainstorm profiles"

[lib]
name = "brainstorm_og"
path = "src/lib.rs"

[[bin]]
name = "brainstorm-og"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "limit"] }
bytes = "1"

# HTTP client (brainstorm-server + avatar fetch); rustls so the image is openssl-free.
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "stream", "rustls", "webpki-roots"] }
# Parsing attacker-supplied avatar URLs before we dial them.
url = "2"
futures-util = { version = "0.3", features = ["sink"] }

# Kind-0 metadata from the in-cluster relay (one relay, from config).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# NIP-19 decode (npub / nprofile).
bech32 = "0.12"
hex = "0.4"

# Card rendering: SVG -> PNG, no headless browser.
resvg = "0.47"
image = "0.25"
base64 = "0.22"

# Bounded in-memory cache.
moka = { version = "0.12", features = ["future"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# Tuned for build time and render speed, not binary size. Size buys little
# here — the image is `scratch` and the fonts are ~19 MB against a ~6 MB
# binary — while `opt-level = "z"` + fat LTO + one codegen unit linked all 372
# transitive deps single-threaded and dominated a ~4 min CI build.
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
# NOTE: deliberately NOT `panic = "abort"`. This process decodes
# attacker-supplied images and rasterises attacker-influenced text; a panic in
# resvg/tiny-skia/image must fail one request via CatchPanicLayer, not restart
# the pod and drop every in-flight crawler with it.
